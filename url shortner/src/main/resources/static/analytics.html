<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Antigravity URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <nav class="navbar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            AGY Links
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1>Link Analytics</h1>
            <p>Track performance, clicks, and geographic distribution.</p>
        </header>

        <section class="glass-panel search-panel">
            <form id="analytics-search-form" class="url-form">
                <div class="input-group">
                    <label for="searchCode">Enter Short Code</label>
                    <div class="alias-input-wrapper">
                        <span class="domain-prefix" id="domain-prefix">agy.link/</span>
                        <input type="text" id="searchCode" placeholder="my-custom-link" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">View Stats</button>
            </form>
            <div id="analytics-error" class="error-message hidden" style="margin-top: 15px;"></div>
        </section>

        <section id="analytics-dashboard" class="analytics-dashboard hidden">
            <div class="stats-grid">
                <div class="stat-card glass-panel">
                    <div class="stat-title">Total Clicks</div>
                    <div class="stat-value" id="total-clicks">0</div>
                </div>
                <div class="stat-card glass-panel">
                    <div class="stat-title">Today's Clicks</div>
                    <div class="stat-value" id="today-clicks">0</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card glass-panel">
                    <h3>Browsers</h3>
                    <ul class="stats-list" id="browser-stats"></ul>
                </div>
                <div class="chart-card glass-panel">
                    <h3>Operating Systems</h3>
                    <ul class="stats-list" id="os-stats"></ul>
                </div>
            </div>
            
            <div class="chart-card glass-panel full-width" style="margin-top: 2rem;">
                <h3>Locations</h3>
                <ul class="stats-list" id="country-stats"></ul>
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const domainPrefix = window.location.host + '/';
            document.getElementById('domain-prefix').textContent = domainPrefix;
            
            // Check if code is in URL params
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                document.getElementById('searchCode').value = code;
                fetchAnalytics(code);
            }

            document.getElementById('analytics-search-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const code = document.getElementById('searchCode').value.trim();
                if (code) fetchAnalytics(code);
            });
        });
    </script>
</body>
</html>
